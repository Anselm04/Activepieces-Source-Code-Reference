name: One-time Activepieces enterprise license boundary cleanup
on:
  push:
    paths:
      - '.github/workflows/trillionai-license-boundary-once.yml'
permissions:
  contents: write
jobs:
  audit-and-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Audit enterprise paths and keep community source only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          root = Path(".")
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          paths = [p for p in paths if p]
          roots = ["packages/ee/", "packages/server/api/src/app/ee/"]
          blocked = sorted(p for p in paths if any(p.startswith(root) for root in roots) and p != "packages/ee/LICENSE")
          licenses = [p for p in paths if p == "packages/ee/LICENSE"]
          for p in blocked:
              subprocess.run(["git", "rm", "-q", "--", p], check=True)
          report = root / ".trillionai" / "LICENCE_BOUNDARY_AUDIT.md"
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(
              "# Activepieces community-source licence boundary audit\n\n"
              "Upstream root LICENSE separates MIT community source from commercial Enterprise paths.\n\n"
              "- Restricted paths audited: `packages/ee/` and `packages/server/api/src/app/ee/`\n"
              "- Restricted implementation files removed from `main`: **" + str(len(blocked)) + "**\n"
              "- Enterprise licence notice retained: **" + str(len(licenses)) + "**\n"
              "- Other existing tracked files before filtering: **" + str(len(paths)) + "**\n"
              "- Original source attribution and `TRILLIONAI_REFERENCE.md` retained.\n"
              "- This cleanup changes the current Git branch only. Prior public commits and snapshot branches may still contain earlier content; full history sanitation needs a separate assessment.\n"
              "- No upstream code or package installation was executed.\n"
              "- Any re-import should enforce this licence filter before publishing.\n",
              encoding="utf-8")
          print("REMOVED_RESTRICTED_FILES=" + str(len(blocked)))
          print("ORIGINAL_TRACKED_FILES=" + str(len(paths)))
          PY
          rm -f .github/workflows/trillionai-license-boundary-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security(license): filter Activepieces enterprise source from main and record audit'
          git push origin HEAD:main
