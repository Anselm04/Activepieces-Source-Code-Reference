name: Preserve original upstream workflow code without running it
on:
  push:
    paths:
      - '.github/workflows/archive-upstream-ci-once.yml'
permissions:
  contents: write
jobs:
  archive:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-inert-ci-archive.yml@main
    with:
      upstream_url: https://github.com/activepieces/activepieces.git
      upstream_sha: b9f66339ed218e564a645d5c8d23e632e9b2d90c
      archive_slug: activepieces
